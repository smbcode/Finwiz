<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <!-- Geometric Low-Poly Bull Gradients & Shading -->
    <filter id="crisp-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g id="finwiz-lowpoly-bull" filter="url(#crisp-shadow)">
    <!-- Horn & Snout (Left Facing) -->
    <polygon points="12,185 82,148 55,202" fill="#be123c" />
